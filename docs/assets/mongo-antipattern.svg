<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 600" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The embedded array anti-pattern</title>
  <desc>A license query fans out into three SBOM documents. Each document embeds its components as one array, so the query walks every array to find a match. The third array has grown past the 16 MB document cap.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .doc { fill: #2C2C2A; stroke: #5F5E5A; stroke-width: 0.5; stroke-dasharray: 4 3; }
      .doc-title { fill: #F1EFE8; font-size: 14px; font-weight: 500; }
      .doc-sub { fill: #B4B2A9; font-size: 12px; }
      .row rect { fill: #3C3489; stroke: #AFA9EC; stroke-width: 0.5; }
      .row text { fill: #CECBF6; font-size: 12px; }
      .hit rect { fill: #633806; stroke: #EF9F27; stroke-width: 0.5; }
      .hit text { fill: #FAC775; font-size: 12px; }
      .query rect { fill: #72243E; stroke: #ED93B1; stroke-width: 0.5; }
      .query text { fill: #F4C0D1; font-size: 14px; font-weight: 500; }
      .edge { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
      .cap { stroke: #E24B4A; stroke-width: 1; stroke-dasharray: 6 4; }
      .cap-label { fill: #F09595; font-size: 12px; }
      .caption { fill: #B4B2A9; font-size: 12px; }
      text { dominant-baseline: central; }
    </style>
  </defs>

  <rect width="680" height="600" fill="#1F1F1D"/>

  <g class="query">
    <rect x="220" y="40" width="240" height="40" rx="8"/>
    <text x="340" y="60" text-anchor="middle">query --license GPL-2.0</text>
  </g>
  <line class="edge" x1="340" y1="80" x2="130" y2="116" marker-end="url(#arrow)"/>
  <line class="edge" x1="340" y1="80" x2="340" y2="116" marker-end="url(#arrow)"/>
  <line class="edge" x1="340" y1="80" x2="550" y2="116" marker-end="url(#arrow)"/>

  <rect class="doc" x="40" y="120" width="180" height="260" rx="12"/>
  <text class="doc-title" x="54" y="140">app-a.cdx.json</text>
  <text class="doc-sub" x="54" y="158">components: [</text>
  <g class="row"><rect x="54" y="172" width="152" height="22" rx="4"/><text x="64" y="183">express@4.19.2</text></g>
  <g class="row"><rect x="54" y="198" width="152" height="22" rx="4"/><text x="64" y="209">lodash@4.17.21</text></g>
  <g class="row"><rect x="54" y="224" width="152" height="22" rx="4"/><text x="64" y="235">ms@2.1.3</text></g>
  <g class="hit"><rect x="54" y="250" width="152" height="22" rx="4"/><text x="64" y="261">foo@1.0.0  GPL-2.0</text></g>
  <g class="row"><rect x="54" y="276" width="152" height="22" rx="4"/><text x="64" y="287">debug@4.3.4</text></g>
  <g class="row"><rect x="54" y="302" width="152" height="22" rx="4"/><text x="64" y="313">ms@2.0.0</text></g>
  <text class="doc-sub" x="54" y="342">…  1,101 items</text>

  <rect class="doc" x="250" y="120" width="180" height="300" rx="12"/>
  <text class="doc-title" x="264" y="140">app-b.cdx.json</text>
  <text class="doc-sub" x="264" y="158">components: [</text>
  <g class="row"><rect x="264" y="172" width="152" height="22" rx="4"/><text x="274" y="183">react@18.3.1</text></g>
  <g class="hit"><rect x="264" y="198" width="152" height="22" rx="4"/><text x="274" y="209">bar@2.4.0  GPL-2.0</text></g>
  <g class="row"><rect x="264" y="224" width="152" height="22" rx="4"/><text x="274" y="235">axios@1.7.2</text></g>
  <g class="row"><rect x="264" y="250" width="152" height="22" rx="4"/><text x="274" y="261">ms@2.1.3</text></g>
  <g class="row"><rect x="264" y="276" width="152" height="22" rx="4"/><text x="274" y="287">debug@4.3.4</text></g>
  <g class="row"><rect x="264" y="302" width="152" height="22" rx="4"/><text x="274" y="313">chalk@5.3.0</text></g>
  <g class="row"><rect x="264" y="328" width="152" height="22" rx="4"/><text x="274" y="339">yargs@17.7.2</text></g>
  <text class="doc-sub" x="264" y="368">…  1,340 items</text>

  <rect class="doc" x="460" y="120" width="180" height="400" rx="12"/>
  <text class="doc-title" x="474" y="140">app-c.cdx.json</text>
  <text class="doc-sub" x="474" y="158">components: [</text>
  <g class="row"><rect x="474" y="172" width="152" height="22" rx="4"/><text x="484" y="183">glibc@2.39</text></g>
  <g class="row"><rect x="474" y="198" width="152" height="22" rx="4"/><text x="484" y="209">openssl@3.3.1</text></g>
  <g class="row"><rect x="474" y="224" width="152" height="22" rx="4"/><text x="484" y="235">python@3.12.4</text></g>
  <g class="row"><rect x="474" y="250" width="152" height="22" rx="4"/><text x="484" y="261">express@4.19.2</text></g>
  <g class="row"><rect x="474" y="276" width="152" height="22" rx="4"/><text x="484" y="287">ms@2.1.3</text></g>
  <g class="row"><rect x="474" y="302" width="152" height="22" rx="4"/><text x="484" y="313">debug@4.3.4</text></g>
  <g class="row"><rect x="474" y="328" width="152" height="22" rx="4"/><text x="484" y="339">zlib@1.3.1</text></g>
  <g class="hit"><rect x="474" y="354" width="152" height="22" rx="4"/><text x="484" y="365">baz@0.9.1  GPL-2.0</text></g>
  <g class="row"><rect x="474" y="380" width="152" height="22" rx="4"/><text x="484" y="391">curl@8.8.0</text></g>
  <g class="row"><rect x="474" y="406" width="152" height="22" rx="4"/><text x="484" y="417">bash@5.2.26</text></g>
  <text class="doc-sub" x="474" y="446">…  8,000+ items</text>

  <line class="cap" x1="40" y1="440" x2="640" y2="440"/>
  <text class="cap-label" x="44" y="458">16 MB document cap</text>

  <text class="caption" x="340" y="560" text-anchor="middle">Every query opens every document and walks its whole array</text>
</svg>
