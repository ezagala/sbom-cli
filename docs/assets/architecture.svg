<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 782" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SBOM CLI architecture</title>
  <desc>Four stacked layers: the CLI, the business logic for ingest, enrich and query, the data model, and the database client. The SQLite store sits outside, below the client. Each layer only calls the one directly below it.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .layer { fill: #2C2C2A; stroke: #5F5E5A; stroke-width: 0.5; stroke-dasharray: 4 3; }
      .layer-title { fill: #F1EFE8; font-size: 14px; font-weight: 500; }
      .layer-sub { fill: #B4B2A9; font-size: 12px; }
      .title { font-size: 14px; font-weight: 500; }
      .sub { font-size: 12px; }
      .arr { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
      .gray rect { fill: #444441; stroke: #B4B2A9; }
      .gray .title { fill: #F1EFE8; }
      .purple rect { fill: #3C3489; stroke: #AFA9EC; }
      .purple .title { fill: #CECBF6; } .purple .sub { fill: #AFA9EC; }
      .teal rect { fill: #085041; stroke: #5DCAA5; }
      .teal .title { fill: #9FE1CB; }
      .coral rect { fill: #712B13; stroke: #F0997B; }
      .coral .title { fill: #F5C4B3; }
      .pink rect { fill: #72243E; stroke: #ED93B1; }
      .pink .title { fill: #F4C0D1; } .pink .sub { fill: #ED93B1; }
      rect { stroke-width: 0.5; }
      text { dominant-baseline: central; }
    </style>
  </defs>

  <rect width="680" height="782" fill="#1F1F1D"/>

  <rect class="layer" x="50" y="40" width="580" height="110" rx="16"/>
  <text class="layer-title" x="70" y="62">CLI</text>
  <text class="layer-sub" x="70" y="80">Reads arguments, prints results, nothing else</text>
  <g class="gray">
    <rect x="70" y="94" width="260" height="40" rx="8"/>
    <text class="title" x="200" y="114" text-anchor="middle">ingest &lt;sbom-file&gt;</text>
  </g>
  <g class="gray">
    <rect x="350" y="94" width="260" height="40" rx="8"/>
    <text class="title" x="480" y="114" text-anchor="middle">query --component | --license</text>
  </g>
  <line class="arr" x1="340" y1="150" x2="340" y2="190" marker-end="url(#arrow)"/>

  <rect class="layer" x="50" y="200" width="580" height="120" rx="16"/>
  <text class="layer-title" x="70" y="222">Business logic</text>
  <text class="layer-sub" x="70" y="240">Knows about SBOMs, knows nothing about flags or tables</text>
  <g class="purple">
    <rect x="65" y="254" width="170" height="52" rx="8"/>
    <text class="title" x="150" y="272" text-anchor="middle">Ingest</text>
    <text class="sub" x="150" y="290" text-anchor="middle">Parse and store</text>
  </g>
  <g class="purple">
    <rect x="255" y="254" width="170" height="52" rx="8"/>
    <text class="title" x="340" y="272" text-anchor="middle">Enrich</text>
    <text class="sub" x="340" y="290" text-anchor="middle">Flag suspect licenses</text>
  </g>
  <g class="purple">
    <rect x="445" y="254" width="170" height="52" rx="8"/>
    <text class="title" x="530" y="272" text-anchor="middle">Query</text>
    <text class="sub" x="530" y="290" text-anchor="middle">Component or license</text>
  </g>
  <line class="arr" x1="340" y1="320" x2="340" y2="360" marker-end="url(#arrow)"/>

  <rect class="layer" x="50" y="370" width="580" height="110" rx="16"/>
  <text class="layer-title" x="70" y="392">Data model</text>
  <text class="layer-sub" x="70" y="410">Plain types shared by the layers above and below</text>
  <g class="teal">
    <rect x="80" y="424" width="160" height="36" rx="8"/>
    <text class="title" x="160" y="442" text-anchor="middle">Document</text>
  </g>
  <g class="teal">
    <rect x="260" y="424" width="160" height="36" rx="8"/>
    <text class="title" x="340" y="442" text-anchor="middle">Component</text>
  </g>
  <g class="teal">
    <rect x="440" y="424" width="160" height="36" rx="8"/>
    <text class="title" x="520" y="442" text-anchor="middle">License</text>
  </g>
  <line class="arr" x1="340" y1="480" x2="340" y2="520" marker-end="url(#arrow)"/>

  <rect class="layer" x="50" y="530" width="580" height="110" rx="16"/>
  <text class="layer-title" x="70" y="552">Database client</text>
  <text class="layer-sub" x="70" y="570">The only place that knows SQL</text>
  <g class="coral">
    <rect x="70" y="584" width="260" height="44" rx="8"/>
    <text class="title" x="200" y="606" text-anchor="middle">Write queries</text>
  </g>
  <g class="coral">
    <rect x="350" y="584" width="260" height="44" rx="8"/>
    <text class="title" x="480" y="606" text-anchor="middle">Read queries</text>
  </g>
  <line class="arr" x1="340" y1="640" x2="340" y2="680" marker-end="url(#arrow)"/>

  <g class="pink">
    <rect x="210" y="690" width="260" height="52" rx="8"/>
    <text class="title" x="340" y="708" text-anchor="middle">SQLite store</text>
    <text class="sub" x="340" y="726" text-anchor="middle">File or in memory</text>
  </g>
</svg>
