<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 382" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SBOM CLI data model</title>
  <desc>Five tables. A document contains many components. A component declares many licenses through a join table, and may appear in many dependency edges. Arrows point from the one side to the many side.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#B4B2A9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .body { fill: #2C2C2A; stroke: #5DCAA5; stroke-width: 0.5; }
      .head { fill: #085041; }
      .title { fill: #9FE1CB; font-size: 14px; font-weight: 500; }
      .field { fill: #F1EFE8; font-size: 12px; }
      .type { fill: #B4B2A9; font-size: 12px; }
      .edge { stroke: #B4B2A9; stroke-width: 1.5; fill: none; }
      text { dominant-baseline: central; }
    </style>
  </defs>

  <rect width="680" height="382" fill="#1F1F1D"/>

  <g class="table">
    <rect class="body" x="40" y="40" width="190" height="172" rx="8"/>
    <path class="head" d="M40 48 a8 8 0 0 1 8 -8 h174 a8 8 0 0 1 8 8 v20 h-190 z"/>
    <text class="title" x="135" y="54" text-anchor="middle">documents</text>
    <text class="field" x="50" y="77">id</text>
    <text class="type" x="220" y="77" text-anchor="end">bigint PK</text>
    <text class="field" x="50" y="95">format</text>
    <text class="type" x="220" y="95" text-anchor="end">text</text>
    <text class="field" x="50" y="113">spec_version</text>
    <text class="type" x="220" y="113" text-anchor="end">text</text>
    <text class="field" x="50" y="131">serial_number</text>
    <text class="type" x="220" y="131" text-anchor="end">text</text>
    <text class="field" x="50" y="149">name</text>
    <text class="type" x="220" y="149" text-anchor="end">text</text>
    <text class="field" x="50" y="167">version</text>
    <text class="type" x="220" y="167" text-anchor="end">text</text>
    <text class="field" x="50" y="185">ingested_at</text>
    <text class="type" x="220" y="185" text-anchor="end">timestamp</text>
    <text class="field" x="50" y="203">raw</text>
    <text class="type" x="220" y="203" text-anchor="end">json</text>
  </g>
  <g class="table">
    <rect class="body" x="270" y="40" width="190" height="136" rx="8"/>
    <path class="head" d="M270 48 a8 8 0 0 1 8 -8 h174 a8 8 0 0 1 8 8 v20 h-190 z"/>
    <text class="title" x="365" y="54" text-anchor="middle">components</text>
    <text class="field" x="280" y="77">id</text>
    <text class="type" x="450" y="77" text-anchor="end">bigint PK</text>
    <text class="field" x="280" y="95">document_id</text>
    <text class="type" x="450" y="95" text-anchor="end">bigint FK</text>
    <text class="field" x="280" y="113">name</text>
    <text class="type" x="450" y="113" text-anchor="end">text</text>
    <text class="field" x="280" y="131">version</text>
    <text class="type" x="450" y="131" text-anchor="end">text</text>
    <text class="field" x="280" y="149">purl</text>
    <text class="type" x="450" y="149" text-anchor="end">text</text>
    <text class="field" x="280" y="167">bom_ref</text>
    <text class="type" x="450" y="167" text-anchor="end">text</text>
  </g>
  <g class="table">
    <rect class="body" x="500" y="40" width="140" height="82" rx="8"/>
    <path class="head" d="M500 48 a8 8 0 0 1 8 -8 h124 a8 8 0 0 1 8 8 v20 h-140 z"/>
    <text class="title" x="570" y="54" text-anchor="middle">licenses</text>
    <text class="field" x="510" y="77">id</text>
    <text class="type" x="630" y="77" text-anchor="end">text PK</text>
    <text class="field" x="510" y="95">name</text>
    <text class="type" x="630" y="95" text-anchor="end">text</text>
    <text class="field" x="510" y="113">suspect</text>
    <text class="type" x="630" y="113" text-anchor="end">boolean</text>
  </g>
  <g class="table">
    <rect class="body" x="160" y="260" width="190" height="82" rx="8"/>
    <path class="head" d="M160 268 a8 8 0 0 1 8 -8 h174 a8 8 0 0 1 8 8 v20 h-190 z"/>
    <text class="title" x="255" y="274" text-anchor="middle">dependencies</text>
    <text class="field" x="170" y="297">document_id</text>
    <text class="type" x="340" y="297" text-anchor="end">bigint PK</text>
    <text class="field" x="170" y="315">parent_id</text>
    <text class="type" x="340" y="315" text-anchor="end">bigint PK</text>
    <text class="field" x="170" y="333">child_id</text>
    <text class="type" x="340" y="333" text-anchor="end">bigint PK</text>
  </g>
  <g class="table">
    <rect class="body" x="400" y="260" width="190" height="82" rx="8"/>
    <path class="head" d="M400 268 a8 8 0 0 1 8 -8 h174 a8 8 0 0 1 8 8 v20 h-190 z"/>
    <text class="title" x="495" y="274" text-anchor="middle">component_licenses</text>
    <text class="field" x="410" y="297">component_id</text>
    <text class="type" x="580" y="297" text-anchor="end">bigint PK</text>
    <text class="field" x="410" y="315">license_id</text>
    <text class="type" x="580" y="315" text-anchor="end">text PK</text>
    <text class="field" x="410" y="333">raw_text</text>
    <text class="type" x="580" y="333" text-anchor="end">text</text>
  </g>
  <path class="edge" d="M230 70 H268" marker-end="url(#arrow)"/>
  <path class="edge" d="M310 176 V218 H255 V258" marker-end="url(#arrow)"/>
  <path class="edge" d="M420 176 V258" marker-end="url(#arrow)"/>
  <path class="edge" d="M570 122 V258" marker-end="url(#arrow)"/>
</svg>
